<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Geist', system-ui, sans-serif; background: #07070A; color: #F5F5F0; }
  body { overflow-x: hidden; }
  input[type="range"] { -webkit-appearance: none; background: transparent; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: #2a2a2a; border-radius: 2px; }
  input[type="range"]::-moz-range-track { height: 4px; background: #2a2a2a; border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: currentColor; border: 2px solid #0A0A0D; margin-top: -6px; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: currentColor; border: 2px solid #0A0A0D; cursor: pointer; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
  @keyframes badgeShimmer {
    0%, 100% { filter: drop-shadow(0 0 2px rgba(255,255,255,0.2)); }
    50%      { filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/tokens.jsx"></script>
<script type="text/babel" src="src/components.jsx"></script>
<script type="text/babel" src="src/trade-components.jsx"></script>
<script type="text/babel" src="src/onboarding-screens.jsx"></script>
<script type="text/babel" src="src/restrained-kit.jsx"></script>
<script type="text/babel" src="src/rookie-screens.jsx"></script>
<script type="text/babel" src="src/pro-screens.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
